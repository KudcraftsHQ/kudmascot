# kudmascot release, mirroring ntfy-android's kc-release (signing, naming, SHA256SUMS) so
# Obtainium tracks it the same way.
# - Every push to main that touches the app or the icons: generate resources from
#   icons/catalog.json, build a signed release APK, publish GitHub Release v1.0.<run>
#   (versionCode = run number) with asset kudmascot-v1.0.<run>.apk.
# - Pull requests / manual runs without a release: debug APK as a workflow artifact.
# Secrets (repo settings): KC_KEYSTORE_BASE64, KC_KEYSTORE_PASSWORD, KC_KEY_ALIAS, KC_KEY_PASSWORD.
name: release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'icons/**'
      - 'scripts/gen-resources.py'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate icon-pack resources from icons/catalog.json
        working-directory: .
        run: python3 scripts/gen-resources.py

      - name: Debug APK (pull requests)
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: kudmascot-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Version from run number
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "KC_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "KC_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "KC_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Signed release APK
        if: env.IS_RELEASE == 'true'
        env:
          KC_KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          if [ -z "$KC_KEYSTORE_BASE64" ] || [ -z "$KC_KEYSTORE_PASSWORD" ] || [ -z "$KC_KEY_ALIAS" ]; then
            echo "Signing secrets are missing; refusing to publish an unsigned APK" >&2; exit 1
          fi
          export KC_KEYSTORE_FILE="$RUNNER_TEMP/kc-release.p12"
          echo "$KC_KEYSTORE_BASE64" | base64 -d > "$KC_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$KC_KEYSTORE_FILE"
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          # Release builds shorten res/ paths, so check by resource NAME (what launchers look up).
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump resources "$APK" > "$RUNNER_TEMP/res.txt"
          grep -E 'xml/(appfilter|drawable)|array/icon_pack' "$RUNNER_TEMP/res.txt"
          for d in $(python3 -c "import json;print(' '.join(i['drawable'] for i in json.load(open('../icons/catalog.json'))['icons']))"); do
            grep -q "drawable/$d " "$RUNNER_TEMP/res.txt" || grep -q "drawable/$d\$" "$RUNNER_TEMP/res.txt" || { echo "missing drawable/$d in APK" >&2; exit 1; }
            echo "ok drawable/$d"
          done
          unzip -p "$APK" assets/appfilter.xml
          mkdir -p ../dist
          cp "$APK" "../dist/kudmascot-${KC_TAG}.apk"
          (cd ../dist && sha256sum *.apk > SHA256SUMS)

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ICONS=$(python3 -c "import json;print(len(json.load(open('icons/catalog.json'))['icons']))")
          NOTES="kudmascot ${KC_VERSION_NAME} (versionCode ${KC_VERSION_CODE}), ${ICONS} icons. Install or update with Obtainium (repo KudcraftsHQ/kudmascot). After updating, re-apply the pack in Nova if icons don't refresh."
          if gh release view "$KC_TAG" >/dev/null 2>&1; then
            gh release upload "$KC_TAG" dist/* --clobber
          else
            gh release create "$KC_TAG" dist/* --target "$GITHUB_SHA" --title "kudmascot ${KC_VERSION_NAME}" --notes "$NOTES"
          fi
